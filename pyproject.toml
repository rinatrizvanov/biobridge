[project]
name = "biobridge"
version = "0.1.0"
description = "Run selected scientific tools locally through a simple graphical interface (experimental)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "toga>=0.5.7,<0.6",
    "uv==0.11.8",  # bundled; creates the engine environment on the user's Mac
    "truststore==0.10.4",  # TLS via the macOS trust store (the bundled Python has no CA file)
    "starlette==1.7.0",    # local web interface (127.0.0.1 only)
    "uvicorn==0.54.0",     # pure-Python server, no optional C extensions
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
]

[dependency-groups]
dev = ["pytest>=8", "briefcase==0.4.5", "httpx==0.28.1", "playwright==1.63.0"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biobridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: runs real SpliceAI inference in the engine environment (slow; downloads reference data on first run)",
    "browser: drives the web interface in real browsers with Playwright (Chromium and WebKit)",
]
addopts = "-m 'not model and not browser'"

[tool.briefcase]
project_name = "BioBridge"
# Reverse-DNS prefix from the maintainer's GitHub account (rinatrizvanov.github.io): the app's
# identifier is io.github.rinatrizvanov.biobridge. Keep it in step with APP_ID in launcher.py.
bundle = "io.github.rinatrizvanov"
version = "0.1.0"

[tool.briefcase.app.biobridge]
formal_name = "BioBridge"
description = "Run SpliceAI locally on your Mac (experimental research software)."
long_description = "Sets up the SpliceAI engine on this Mac and scores GRCh38 variants in a local browser interface. Experimental research software, not a diagnostic."
sources = ["src/biobridge"]
requires = ["uv==0.11.8", "truststore==0.10.4", "starlette==1.7.0", "uvicorn==0.54.0", "jinja2==3.1.6", "python-multipart==0.0.32"]
# Console-script wrappers from dependencies are unused and embed the build machine's
# path in their shebang. Remove everything in app_packages/bin except the uv binary:
# names not starting with "u", "u" + anything but "v", and "uv" + at least one more character.
cleanup_paths = [
    "**/app_packages/bin/[!u]*",
    "**/app_packages/bin/u[!v]*",
    "**/app_packages/bin/uv?*",
]

[tool.briefcase.app.biobridge.macOS]
requires = ["toga-cocoa==0.5.7"]
# The documented minimum (unverified; see the README's platform table). Without it the
# app would declare the support package's minimum, macOS 11.
min_os_version = "14.0"
# The app's own runtime (launcher and local web interface): BeeWare's Python 3.13 support
# package b16 = python.org macOS framework 3.13.16 with OpenSSL 3.5.9 (verified from the
# binaries). Briefcase 0.4.5 would otherwise use b15 (3.13.15, OpenSSL 3.0.21). Briefcase picks
# the Python minor version it runs under, set by .python-version. The SpliceAI engine is a
# separate Python 3.11 environment (setup/envs.py).
support_revision = "16"
support_package_hash = "sha256:29334305ef0e1e7e58198c195c7e3707afe38be9ebf134840b156c369f84f737"
universal_build = false
