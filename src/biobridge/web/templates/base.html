<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}BioBridge{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="bb-header">
  <a class="bb-brand" href="/">BioBridge</a>
  <span class="bb-pill">Experimental research software · not a diagnostic</span>
</header>
<main class="bb-main">
{% block main %}{% endblock %}
</main>
<footer class="bb-footer">
  <span>BioBridge {{ version }} · SpliceAI runs on this Mac; nothing is sent to a server.</span>
  <form method="post" action="/quit"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="bb-link" type="submit">Quit BioBridge</button></form>
</footer>
</body>
</html>
